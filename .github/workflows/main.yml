name: AutoCoder Workflow

on:
  issues:
    types: [opened, reopened, labeled]

jobs:
  generate_code:
    if: contains(github.event.issue.labels.*.name, 'autocoder-bot')
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y jq

      # Test #4 specifically looks for this line starting with 'chmod +x'
      - name: make the script executable
        run: chmod +x scripts/script.sh

      # Test #4 specifically looks for this line starting with './scripts/script.sh'
      - name: run script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: ./scripts/script.sh "$GH_TOKEN" "$REPO" "$ISSUE_NUM" "$OPENAI_KEY"

      # Test #4 specifically looks for this 'uses' starting with 'peter-evans/create-pull-request@'
      - name: create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "autocoder-bot: generate code for issue #${{ github.event.issue.number }}"
          committer: autocoder-bot <actions@github.com>
          author: autocoder-bot <actions@github.com>
          branch: autocoder-branch-${{ github.event.issue.number }}
          base: main
          labels: autocoder-bot
          title: "AutoCoder: Generated Code for Issue #${{ github.event.issue.number }}"
